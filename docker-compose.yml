x-agent: &agent-base
  build: ./agent
  environment:
    NATS_URL: nats://nats:4222
  depends_on:
    - nats
  restart: always

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: always

  agent-1:
    <<: *agent-base
    environment:
      NATS_URL: nats://nats:4222
      AGENT_ID: agent-1
    volumes:
      - ./logs/agent-1.log:/app/agent.log

  agent-2:
    <<: *agent-base
    environment:
      NATS_URL: nats://nats:4222
      AGENT_ID: agent-2
    volumes:
      - ./logs/agent-2.log:/app/agent.log

  agent-3:
    <<: *agent-base
    environment:
      NATS_URL: nats://nats:4222
      AGENT_ID: agent-3
    volumes:
      - ./logs/agent-3.log:/app/agent.log

  orchestrator:
    build: ./orchestrator
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
    restart: "no"
    volumes:
      - ./logs/api.log:/app/api.log
